# nginx do site publicado (imagem do Dockerfile, no EasyPanel). Faz o mesmo que o .htaccess (Apache/Hostinger).
# Os cabeçalhos de segurança, inclusive a CSP, têm de ser iguais aos do .htaccess: npm test confere.
# HTTPS e "www" ficam por conta do domínio configurado no EasyPanel.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  server_tokens off;
  autoindex off;
  # Redirecionamentos com endereço relativo: atrás do proxy do EasyPanel o nginx não sabe que a visita é https.
  absolute_redirect off;

  gzip on;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
  # connect.facebook.net e www.facebook.com: Pixel da Meta (script, envio de eventos e imagem do <noscript>)
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.facebook.com https://connect.facebook.net; connect-src 'self' https://www.facebook.com https://connect.facebook.net; frame-src https://www.facebook.com; object-src 'none'; base-uri 'self'; form-action 'self' https://www.facebook.com; frame-ancestors 'self'; upgrade-insecure-requests" always;

  error_page 404 /404.html;

  # Arquivos ocultos (exceto .well-known), ferramentas de desenvolvimento e arquivos de trabalho: proibido.
  # (O .dockerignore já os deixa fora da imagem; isto é a segunda proteção.)
  location ~ /\.(?!well-known/) { return 403; }
  location ~ ^/(node_modules|tests|tools|fotos)(/|$) { return 403; }
  location ~* \.(bak|old|orig|log|sql|sh|py|ini|env|md|zip|mjs)$ { return 403; }
  location ~ ^/package(-lock)?\.json$ { return 403; }

  # Versões em outros idiomas: /en/ vira /en (com a barra no fim, os caminhos relativos quebram)
  location ~ ^/(en|es|pt-pt)/$ { return 301 /$1; }

  # Cache: HTML e JS (inclui as traduções) sempre atualizados; imagens e ícones por 30 dias
  location ~* \.(webp|png|jpg|jpeg|svg|ico)$ { expires 30d; }
  location ~* \.(html|js)$ { expires -1; }

  # URLs limpas: /privacidade, /termos, /en, /es e /pt-pt
  location / {
    expires -1;
    try_files $uri $uri.html $uri/ =404;
  }
}
